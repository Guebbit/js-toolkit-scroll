<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazyload</title>
  <style>
    /*
      Every asset is local and every box has a fixed size, so the specs can
      scroll to a target and know exactly what is on screen. Remote assets made
      the outcome depend on the network, and auto-sized media made it depend on
      how fast the file decoded.
    */
    body {
      margin: 0;
    }
    .spacer {
      height: 1000px;
    }
    .media {
      display: block;
      width: 300px;
      height: 300px;
      object-fit: cover;
      background: #ddd;
    }
    /* Proves the loaded class arrives: the box only turns green once it does. */
    .loaded {
      outline: 4px solid green;
    }
  </style>
</head>
<body>

<div class="spacer"></div>

<img id="image-plain" class="media" alt="" data-src="images/sally.jpg">

<div class="spacer"></div>

<img id="image-second" class="media" alt="" data-src="images/cosace.jpg">

<div class="spacer"></div>

<picture id="picture-block">
  <source data-srcset="images/depth-1.png" media="(min-width: 1px)">
  <img id="picture-fallback" class="media" alt="" data-src="images/depth-2.png">
</picture>

<div class="spacer"></div>

<video id="video-sourced" class="media" muted playsinline>
  <source id="video-source" data-src="media/clip.webm" type="video/webm">
</video>

<div class="spacer"></div>

<video id="video-direct" class="media" muted playsinline data-src="media/clip.mp4"></video>

<div class="spacer"></div>

<img id="image-forced" class="media lazyload-forced" alt="" data-src="images/depth-3.png">

<div class="spacer"></div>

</body>
</html>
